# =============================================================================
# Spectral wrapper around the BC Government SDX ruleset
# =============================================================================
# The SDX ruleset is a config-style ruleset. When another config-style ruleset
# (strict-ruleset.yaml) is extended alongside it, spectral's merge order causes
# the remote SDX rules to override local severity overrides. Wrapping the remote
# ruleset here and softening the OAuth2 checks lets the API keep its API key
# scheme while still surfacing the SDX provisioning rules as warnings.
# =============================================================================

extends:
  - https://raw.githubusercontent.com/bcgov/itk-api-governance/main/dist/spectral/sdx-ruleset.yaml

rules:
  # The API authenticates with an API key rather than SDX OAuth2.
  # Keep the SDX provisioning checks visible as warnings instead of errors.
  sdx-oauth2-security-schemes: warn
  sdx-operation-security-scopes: warn